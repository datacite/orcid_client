        distribution and succession of epiphytes on Coco nucifera in Moorea, French
        Polynesia. Coconut trees are a conspicuous and characteristic part of the
        South Pacific Landscape. In the past fifty years, a number of coconut tree
        plantations have been abandoned. These provide for an excellent study of the
        succession of the epiphytes that use coconut trees as phorophytes. Seven functional
        epiphyte groups were studied: Bryophytes, Paint Crustose Lichens, Fat Crustose
        Lichens, Alectorioid Lichens, Cyanobacterial Lichens, Algae and Ferns. Five
        types of plots were studied, those that had been abandoned for fourty-five
        years, thirty-five years, twenty-five years, fifteen years, and zero years.
        Principle Component Analysis confirmed the grouping of the thirteen plots
        studied within the aforementioned categories. Eight environmental variables
        of the plots were examined to determine which one had the largest influence
        on the change in epiphyte composition throughout time. Surrounding canopy
        cover and canopy height were the two main influential factors determining
        epiphyte distribution between the plot types as seen through regression and
        multivariate analysis. Results also showed that Bryophytes are late-successional
        species and Paint Crustose Lichens and Alectorioid Lichens are pioneer species
        on Coco nucifera. Succession does occur and radically changes the distributions
        of the epiphyte functional groups on the coconut trees over time. Epiphytes
        were found on all plot types from the 20% coverage level and above. A two-tiered
        model was created to explain succession of epiphytes on coconut trees.","descriptionType":"Abstract"}],"geoLocations":[{"geoLocationPlace":"terrestrial"},{"geoLocationPlace":"Moorea"},{"geoLocationPlace":"French
